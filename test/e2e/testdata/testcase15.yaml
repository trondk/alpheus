# testcase15 (SPEC 12.1, GO-143): testcase14's component with a bug, looked
# at through alpheus ui running in the cluster. pass fails on the chunk
# whose header has number 5, with one restart; the test then reads the run,
# its kept logs and failure through the UI, and replays the last attempt
# as a pod in the cluster, which must fail the same way at debug level.
# hack/e2e.sh installs the UI with the chart, sets the image, pinned by
# digest, the test sets the sizes, and the test creates the Secret
# alpheus-s3 in its namespace.
apiVersion: alpheus-dev.org/v1alpha1
kind: StreamRun
metadata:
  name: testcase15
spec:
  steps:
    - name: source
      image: ${BENCH_IMAGE}
      settings: {role: source, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 15}
    - name: pass
      image: ${BENCH_IMAGE}
      maxRestarts: 1
      maxOpen: 2
      settings: {role: pass, fail: 5, delay: 1000}
    - name: sink
      image: ${BENCH_IMAGE}
      settings: {role: sink, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 15}
  edges:
    - {from: source, to: pass}
    - {from: pass, to: sink}
  chunks: {maxBytes: 1Gi, maxUnacked: ${BENCH_MAX_UNACKED}}
  storage:
    endpoint: http://garage.storage.svc.cluster.local:3900
    bucket: alpheus-data
    region: garage
    secretRef: alpheus-s3

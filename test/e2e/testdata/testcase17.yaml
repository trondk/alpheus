# testcase17 (SPEC 12.1, GO-67, GO-144): a node is lost. pass prefers the
# worker and is slow; in the middle of the run the test powers the worker
# off and deletes its Node, as a cloud provider does with a dead machine.
# Kubernetes deletes the pod that was on it, the controller starts a new
# attempt, which runs on the control plane, and the run must succeed with
# every chunk once and exact counts. The test powers the worker on again.
# hack/e2e.sh sets the image, pinned by digest, the test sets the sizes,
# and the test creates the Secret alpheus-s3 in its namespace.
apiVersion: alpheus-dev.org/v1alpha1
kind: StreamRun
metadata:
  name: testcase17
spec:
  steps:
    - name: source
      image: ${BENCH_IMAGE}
      nodeSelector: {kubernetes.io/hostname: alpheus-talos}
      settings: {role: source, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 17}
    - name: pass
      image: ${BENCH_IMAGE}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [alpheus-talos-worker]}
      settings: {role: pass, delay: 300}
    - name: sink
      image: ${BENCH_IMAGE}
      nodeSelector: {kubernetes.io/hostname: alpheus-talos}
      settings: {role: sink, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 17}
  edges:
    - {from: source, to: pass}
    - {from: pass, to: sink}
  chunks: {maxBytes: 1Gi, maxUnacked: ${BENCH_MAX_UNACKED}}
  storage:
    endpoint: http://garage.storage.svc.cluster.local:3900
    bucket: alpheus-data
    region: garage
    secretRef: alpheus-s3

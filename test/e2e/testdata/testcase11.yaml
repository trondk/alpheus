# testcase11 (SPEC 12.1, GO-137): the storage refuses the run's keys. The
# test creates the Secret alpheus-s3-wrong with the right key ID and a
# wrong secret, so Garage answers SignatureDoesNotMatch.
# hack/e2e.sh sets the image, pinned by digest, and the test sets the sizes.
apiVersion: alpheus-dev.org/v1alpha1
kind: StreamRun
metadata:
  name: testcase11
spec:
  steps:
    - name: source
      image: ${BENCH_IMAGE}
      settings: {role: source, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 11}
    - name: sink
      image: ${BENCH_IMAGE}
      settings: {role: sink, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 11}
  edges:
    - {from: source, to: sink}
  storage:
    endpoint: http://garage.storage.svc.cluster.local:3900
    bucket: alpheus-data
    region: garage
    secretRef: alpheus-s3-wrong

# testcase18 (SPEC 12.1, GO-66): the chart is upgraded in the middle of a
# run. hack/test-upgrade.sh installs the chart and images of an older
# commit, and the run uses that commit's test component, as a user's
# components are not rebuilt when Alpheus is upgraded. pass is slow, so
# the run is still going when the test upgrades the chart to this commit's,
# with its CRD, controller and agent. The test sets the sizes and creates
# the Secret alpheus-s3 in its namespace.
apiVersion: alpheus-dev.org/v1alpha1
kind: StreamRun
metadata:
  name: testcase18
spec:
  steps:
    - name: source
      image: ${ALPHEUS_E2E_UPGRADE_BENCH_IMAGE}
      settings: {role: source, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 18}
    - name: pass
      image: ${ALPHEUS_E2E_UPGRADE_BENCH_IMAGE}
      replicas: 2
      settings: {role: pass, delay: 4000}
    - name: sink
      image: ${ALPHEUS_E2E_UPGRADE_BENCH_IMAGE}
      settings: {role: sink, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 18}
  edges:
    - {from: source, to: pass}
    - {from: pass, to: sink}
  chunks: {maxBytes: 1Gi, maxUnacked: ${BENCH_MAX_UNACKED}}
  storage:
    endpoint: http://garage.storage.svc.cluster.local:3900
    bucket: alpheus-data
    region: garage
    secretRef: alpheus-s3

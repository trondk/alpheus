    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          StreamRun is one run of a flow: a graph of steps that run at the same
          time and pass chunks to each other through object storage. A chunk is a
          file in any format; Alpheus moves it and never reads it.

          Create it to start the run, read its status to follow it, set
          spec.cancel to stop it, and delete it to clean up.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              StreamRunSpec describes the flow. Everything except cancel is immutable
              after creation.
            properties:
              cancel:
                description: Cancel stops the run. It can be set to true once and
                  not undone.
                type: boolean
              chunks:
                default: {}
                description: |-
                  Chunks sets how output is cut into chunks and how far a producer may
                  run ahead of its consumers.
                properties:
                  maxBytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxBytes is the largest chunk; closing a larger file is an error
                      (GO-105). Not set means no limit.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxUnacked:
                    default: 4
                    description: |-
                      MaxUnacked is how many chunks a consumer replica may have unacked
                      from a stream before the producer blocks (GO-35).
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                type: object
              edges:
                description: |-
                  Edges connect the output of one step to the input of another. The
                  graph must not have cycles; that is checked by the controller and by
                  alpheus validate, since a CEL rule cannot follow a path (GO-23).
                items:
                  description: |-
                    Edge connects an output of one step to the input of another. A step's
                    output can have several edges (fan-out), and a step can have several
                    incoming edges (fan-in).
                  properties:
                    from:
                      description: From is the name of the producing step.
                      maxLength: 20
                      minLength: 1
                      type: string
                    output:
                      default: default
                      description: Output is the producer's named output, as given
                        to Create in the SDK.
                      maxLength: 20
                      minLength: 1
                      pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    port:
                      default: default
                      description: Port is the consumer's named input the edge ends
                        in (GO-108).
                      maxLength: 20
                      minLength: 1
                      pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    side:
                      description: |-
                        Side makes the edge a side input: lookup data the consumer reads
                        whole before the rest, such as the customers in a join. Every
                        replica of the consumer gets all of its chunks, and a new attempt
                        gets them all again; it does not hold back its producer, so keep it
                        small (GO-167).
                      type: boolean
                    to:
                      description: To is the name of the consuming step.
                      maxLength: 20
                      minLength: 1
                      type: string
                  required:
                  - from
                  - to
                  type: object
                  x-kubernetes-validations:
                  - message: a step cannot read its own output
                    rule: self.from != self.to
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - from
                - output
                - to
                x-kubernetes-list-type: map

                default: 168h
                description: |-
                  ResultsTTL is how long the run's results, error logs and summary are
                  kept after it has finished; "0s" means the controller never deletes
                  them (GO-78).
                type: string
              signals:
                default: {}
                description: |-
                  Signals selects how agents tell each other that chunks are ready.
                  Correctness never depends on signals; agents fall back to polling.
                properties:
                  driver:
                    default: builtin
                    description: Driver is the signal driver. builtin is the only
                      one.
                    enum:
                    - builtin
                    type: string
                type: object
              steps:
                description: Steps are the containers of the flow. Names are unique
                  within the run.
                items:
                  description: Step is one container in the flow.
                  properties:

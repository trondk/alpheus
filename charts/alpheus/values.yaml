# Where images are pulled from. Empty means the project's own registry,
# registry.alpheus-dev.org. Set it to a mirror, such as Zot in an
# air-gapped cluster; the repositories keep their paths there (SPEC 14).
registry: ""

# Secrets for pulling the controller's image. The agent runs in each run's
# namespace, so a private registry needs a pull secret there too.
imagePullSecrets: []

controller:
  image:
    repository: alpheus-dev/controller
    # Empty means the chart's appVersion.
    tag: ""
    # sha256:…, used instead of the tag. A released chart has it set.
    digest: ""
    pullPolicy: IfNotPresent
  # More than one replica gives a standby; only the leader reconciles and
  # runs the signal hub (GO-73).
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  # Allows component images without a digest, and the agent's image by
  # tag. For development only (GO-24, GO-26).
  allowTags: false
  nodeSelector: {}
  tolerations: []
  affinity: {}

agent:
  image:
    repository: alpheus-dev/agent
    tag: ""
    # Required unless controller.allowTags is set (GO-24).
    digest: ""

signalHub:
  # Without the hub, agents only poll the manifests: slower, but correct.
  enabled: true
  port: 7070

ui:
  # alpheus ui as a Deployment, a page the team shares (GO-143). Reach it
  # with kubectl port-forward -n <release namespace> svc/alpheus-ui 7171,
  # then http://localhost:7171/, or through the Ingress below.
  enabled: false
  image:
    repository: alpheus-dev/ui
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # The namespaces whose runs' logs, error logs and failures the UI may
  # read, and where its replay button starts pods. Reading them means
  # reading the runs' storage Secrets there. ["*"] is every namespace.
  # Runs and events of every namespace are always shown.
  namespaces: []
  # The replay button runs a failed attempt again as a pod in the run's
  # namespace. Off, the page shows the command instead.
  replay: true
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  # How the UI's Service is reached: ClusterIP for kubectl port-forward,
  # or NodePort on nodePort, as the test cluster does. A NodePort reaches
  # it from outside the cluster without a login.
  service:
    type: ClusterIP
    nodePort: null
  # Host names besides localhost the page answers to, such as the node's
  # address with a NodePort. The Ingress's host is added by itself.
  hosts: []
  # Without a login of its own, the UI shows everyone who reaches it what
  # its service account may see. Put an authenticating proxy in front of
  # an Ingress.
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: []

metrics:
  # prometheus.io/scrape annotations on the controller's pods; step pods
  # always have them, for the agent's metrics on port 9090 (GO-51).
  annotations: true
  # A ServiceMonitor for the controller and a PodMonitor for the agents in
  # every namespace, for the Prometheus Operator. Needs its CRDs.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # The Grafana dashboard as a ConfigMap, for Grafana's sidecar that loads
  # dashboards by label.
  grafanaDashboard:
    enabled: false
    labels: {grafana_dashboard: "1"}

crds:
  # Installs and upgrades the StreamRun CRD. It is kept when the release is
  # uninstalled, since deleting it deletes every StreamRun.
  install: true
